<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="SmartJobTracker — Copilote IA pour la recherche d'emploi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F1020"/>
      <stop offset="1" stop-color="#1B1440"/>
    </linearGradient>
    <linearGradient id="brand" x1="80" y1="120" x2="180" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="140" r="420" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(90,96)">
    <rect width="96" height="96" rx="24" fill="url(#brand)"/>
    <polyline points="24,50 42,68 74,26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="74" cy="26" r="6.5" fill="#ffffff"/>
  </g>
  <text x="208" y="163" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#ffffff">Smart<tspan fill="#A78BFA">Job</tspan>Tracker</text>

  <!-- Eyebrow -->
  <text x="92" y="288" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="0.5" fill="#A78BFA">COPILOTE IA POUR LA RECHERCHE D'EMPLOI</text>

  <!-- Headline -->
  <text x="90" y="360" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#ffffff">Gérez 50 candidatures</text>
  <text x="90" y="436" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#ffffff">en parallèle, sans effort.</text>

  <!-- Feature chips -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="600" fill="#E5E7EB">
    <rect x="90" y="486" width="210" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="116" y="519">Synchro Gmail</text>
    <rect x="316" y="486" width="222" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="342" y="519">CV adaptés par IA</text>
    <rect x="554" y="486" width="230" height="52" rx="26" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="580" y="519">Entretien blanc IA</text>
  </g>

  <!-- Domain -->
  <text x="90" y="592" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" fill="#8B8BA7">smartjobtracker.com</text>
</svg>
