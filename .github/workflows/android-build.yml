name: Build Android APK

# Builds an installable debug APK in the cloud so no local Android SDK / JDK is
# needed. Download it from the run's "Artifacts" section (smartjobtracker-debug-apk).
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Serialize runs on a branch so the APK-refresh commits below don't race.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow committing the refreshed APK back to public/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          # Inlined into the bundle at build time (same as Vercel). Add these as
          # repo secrets to enable Supabase sync/auth in the APK. When unset they
          # resolve to empty and supabase.js falls back to local-only mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ADZUNA_APP_ID: ${{ secrets.VITE_ADZUNA_APP_ID }}
          VITE_ADZUNA_APP_KEY: ${{ secrets.VITE_ADZUNA_APP_KEY }}
          VITE_CLAUDE_MODEL: ${{ secrets.VITE_CLAUDE_MODEL }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # public/ is copied into dist/ by Vite, and cap sync bundles dist/ into the
      # APK — so the download-only files (the APK itself, the .xpi add-ons) would
      # get embedded inside the app, ballooning it every build. Strip them; Vercel
      # builds its own dist and still serves them for the website.
      - name: Trim download-only assets from the bundled app
        run: rm -f dist/*.apk dist/*.xpi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartjobtracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keep the website's download (public/smartjobtracker.apk) in sync with the
      # latest build. Only commits when the APK actually changed. The push uses
      # GITHUB_TOKEN, which by design does not re-trigger this workflow, and
      # public/ isn't in the trigger paths anyway — so no build loop.
      - name: Publish APK to public/ for the website download
        if: github.ref == 'refs/heads/main'
        run: |
          # Save the built APK outside the work tree, then commit it on top of a
          # clean, up-to-date main. `git reset --hard origin/main` each attempt
          # discards build-dirtied tracked files (cap sync regenerates some) and
          # any concurrent bot commit, so this never trips on "unstaged changes".
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/app-debug.apk" public/smartjobtracker.apk
            if git diff --quiet -- public/smartjobtracker.apk; then
              echo "APK unchanged — nothing to commit."
              exit 0
            fi
            git add public/smartjobtracker.apk
            git commit -m "chore(android): refresh downloadable APK [skip ci]"
            if git push origin HEAD:main; then
              echo "Published refreshed APK."
              exit 0
            fi
            echo "push attempt $attempt rejected (concurrent push); retrying…"
            sleep $((attempt * 5))
          done
          echo "Failed to publish APK after 3 attempts"
          exit 1
